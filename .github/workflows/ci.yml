name: WasteLens camera foundation checks
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install UI dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Typecheck and build UI
        working-directory: frontend
        run: npm run build
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies (no model weights)
        run: python -m pip install 'fastapi>=0.115,<1' 'uvicorn>=0.32,<1' 'python-multipart>=0.0.20,<1' 'pillow>=11,<13' 'pytest>=8,<10' 'httpx>=0.27,<1'
      - name: Unit and API contract tests
        working-directory: backend
        run: python -m pytest -q
      - name: Compile backend and downloader
        run: python -m compileall -q backend scripts
